<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>পণ্য ম্যানেজার | আরিফ স্টুডিও</title>
  <meta name="theme-color" content="#091723">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <section class="login-card" id="login-view" hidden>
      <img src="../images/logo/mark.svg" width="64" height="64" alt="">
      <p class="eyebrow">আরিফ স্টুডিও</p>
      <h1>পণ্য ম্যানেজার</h1>
      <p class="intro">পণ্য যোগ, আপডেট বা মুছতে অ্যাডমিন পাসওয়ার্ড দিন।</p>
      <form id="login-form">
        <label for="admin-password">পাসওয়ার্ড</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <button class="primary-button" type="submit">লগইন করুন</button>
        <p class="form-error" id="login-error" role="alert"></p>
      </form>
      <a class="back-link" href="../accessories.html">← পণ্যের পেজ দেখুন</a>
    </section>

    <section class="dashboard" id="dashboard-view" hidden>
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <img src="../images/logo/mark.svg" width="44" height="44" alt="">
          <div><strong>পণ্য ম্যানেজার</strong><small>আরিফ স্টুডিও</small></div>
        </div>
        <div class="header-actions">
          <a href="../accessories.html" target="_blank" rel="noopener">পেজ দেখুন</a>
          <button id="logout-button" type="button">লগআউট</button>
        </div>
      </header>

      <div class="dashboard-main">
        <div class="dashboard-title">
          <div><h1>এক্সেসরিজ পণ্য</h1><p id="admin-count"></p></div>
          <button class="primary-button add-button" id="add-product" type="button">＋ নতুন পণ্য</button>
        </div>
        <div class="admin-state" id="admin-state" aria-live="polite">পণ্য লোড হচ্ছে…</div>
        <div class="admin-products" id="admin-products"></div>
      </div>
    </section>
  </main>

  <dialog id="product-dialog" aria-labelledby="dialog-title">
    <form id="product-form">
      <div class="dialog-header">
        <div><p class="eyebrow">পণ্যের তথ্য</p><h2 id="dialog-title">নতুন পণ্য যোগ করুন</h2></div>
        <button class="icon-button" id="close-dialog" type="button" aria-label="বন্ধ করুন">×</button>
      </div>
      <input id="product-id" type="hidden">
      <label for="product-name">পণ্যের নাম <span>*</span></label>
      <input id="product-name" type="text" maxlength="120" required placeholder="যেমন: ফাস্ট চার্জার">
      <label for="product-name-en">ইংরেজি নাম <small>(ঐচ্ছিক)</small></label>
      <input id="product-name-en" type="text" maxlength="120" placeholder="Example: Fast charger">
      <label for="product-price">দাম (৳) <span>*</span></label>
      <input id="product-price" type="number" min="0" max="999999999" step="1" inputmode="numeric" required placeholder="500">
      <label class="stock-control" for="product-stock">
        <input id="product-stock" type="checkbox" checked>
        <span><strong>স্টকে আছে</strong><small>স্টক শেষ হলে টিক তুলে দিন</small></span>
      </label>
      <label for="product-image">পণ্যের ছবি <span id="image-required">*</span></label>
      <input id="product-image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
      <p class="field-help">JPG, PNG বা WebP। ছবি আপলোডের আগে স্বয়ংক্রিয়ভাবে ছোট ও দ্রুত করা হবে।</p>
      <div class="image-preview" id="image-preview" hidden><img id="preview-image" alt="নির্বাচিত পণ্যের ছবির প্রিভিউ"></div>
      <div class="dialog-actions">
        <button class="secondary-button" id="cancel-product" type="button">বাতিল</button>
        <button class="primary-button" id="save-product" type="submit">পণ্য সেভ করুন</button>
      </div>
      <p class="form-error" id="product-error" role="alert"></p>
    </form>
  </dialog>

  <div class="toast" id="admin-toast" role="status" aria-live="polite"></div>
</body>
</html>
